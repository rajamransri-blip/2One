name: Child Android APK
on:
  push:
    paths: ['child_app/**', '.github/workflows/child-android.yml']
  pull_request:
    paths: ['child_app/**', '.github/workflows/child-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  child-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build small native Child APK
        working-directory: child_app
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: family-safety-child-debug-apk
          path: child_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
