name: Child Android APK
on:
  push:
    paths: ['child_app/**', '.github/workflows/child-android.yml']
  pull_request:
    paths: ['child_app/**', '.github/workflows/child-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  child-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev \
            gettext autopoint patch build-essential ccache
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'Cython==0.29.37' 'buildozer==1.5.0'
      - name: Compile child source and service
        run: python -m compileall -q child_app
      - name: Build child debug APK
        working-directory: child_app
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: family-safety-child-debug-apk
          path: child_app/bin/*.apk
          if-no-files-found: error
