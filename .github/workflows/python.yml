name: Build PTv APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libtool-bin \
            libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev gettext autopoint patch build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.37" "buildozer==1.5.0"

      - name: Validate PTv source
        working-directory: python
        run: python -m py_compile main.py

      - name: Build PTv debug APK
        working-directory: python
        env:
          P4A_BUILD_PYTHON_VERSION: "3.10.11"
        run: buildozer -v android debug

      - name: Verify APK
        working-directory: python
        run: test -n "$(find bin -type f -name '*.apk' -print -quit)"

      - name: Upload PTv APK
        uses: actions/upload-artifact@v4
        with:
          name: PTv-APK
          path: python/bin/*.apk
          if-no-files-found: error
