name: Build Cloud Control APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android project
        shell: bash
        run: |
          rm -rf app

          mkdir -p app/src/main/java/com/cloudcontrol/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CloudControl"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.cloudcontrol.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.cloudcontrol.app'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Cloud Control</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.Material3.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/cloudcontrol/app/MainActivity.kt <<'EOF'
          package com.cloudcontrol.app

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.*
          import okhttp3.*
          import java.io.IOException
          import java.util.UUID

          class MainActivity : Activity() {

              private lateinit var server: EditText
              private lateinit var token: EditText
              private lateinit var result: TextView

              private val client = OkHttpClient()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  buildUI()
              }

              private fun buildUI() {

                  val root = LinearLayout(this)

                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(32, 28, 32, 28)
                  root.setBackgroundColor(Color.WHITE)

                  val title = TextView(this)

                  title.text = "Cloud Control"
                  title.textSize = 28f
                  title.setTextColor(Color.BLACK)

                  root.addView(
                      title,
                      LinearLayout.LayoutParams(
                          -1,
                          70
                      )
                  )

                  val subtitle = TextView(this)

                  subtitle.text =
                      "Universal FastAPI Cloud Manager"

                  subtitle.textSize = 15f

                  root.addView(
                      subtitle,
                      LinearLayout.LayoutParams(
                          -1,
                          55
                      )
                  )

                  server = EditText(this)

                  server.hint =
                      "https://your-server.onrender.com"

                  server.singleLine = true

                  root.addView(
                      server,
                      LinearLayout.LayoutParams(
                          -1,
                          65
                      )
                  )

                  token = EditText(this)

                  token.hint = "Cloud Token"
                  token.singleLine = true

                  root.addView(
                      token,
                      LinearLayout.LayoutParams(
                          -1,
                          65
                      )
                  )

                  addButton(
                      root,
                      "Server Status"
                  ) {
                      request(
                          "GET",
                          "/api/v1/server"
                      )
                  }

                  addButton(
                      root,
                      "Connected Devices"
                  ) {
                      request(
                          "GET",
                          "/api/v1/devices"
                      )
                  }

                  addButton(
                      root,
                      "Services"
                  ) {
                      request(
                          "GET",
                          "/api/v1/services"
                      )
                  }

                  addButton(
                      root,
                      "Create Python Token"
                  ) {
                      createToken("python")
                  }

                  addButton(
                      root,
                      "Create Supabase Token"
                  ) {
                      createToken("supabase")
                  }

                  addButton(
                      root,
                      "Create Firebase Token"
                  ) {
                      createToken("firebase")
                  }

                  result = TextView(this)

                  result.text =
                      "Ready"

                  result.textSize = 14f
                  result.setTextColor(Color.DKGRAY)
                  result.setPadding(0, 25, 0, 0)

                  root.addView(
                      result,
                      LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f
                      )
                  )

                  setContentView(root)
              }

              private fun addButton(
                  root: LinearLayout,
                  label: String,
                  action: () -> Unit
              ) {

                  val button = Button(this)

                  button.text = label

                  button.setOnClickListener {
                      action()
                  }

                  root.addView(
                      button,
                      LinearLayout.LayoutParams(
                          -1,
                          55
                      )
                  )
              }

              private fun baseUrl(): String {

                  return server.text
                      .toString()
                      .trim()
                      .removeSuffix("/")
              }

              private fun headers(builder: Request.Builder) {

                  val t =
                      token.text.toString().trim()

                  if (t.isNotEmpty()) {
                      builder.header(
                          "Authorization",
                          "Bearer $t"
                      )
                  }
              }

              private fun request(
                  method: String,
                  path: String
              ) {

                  val url =
                      baseUrl() + path

                  if (url.contains("your-server")) {
                      result.text =
                          "Enter your Render server URL first."
                      return
                  }

                  val builder =
                      Request.Builder()
                          .url(url)

                  headers(builder)

                  when (method) {
                      "GET" ->
                          builder.get()
                  }

                  client.newCall(
                      builder.build()
                  ).enqueue(
                      object : Callback {

                          override fun onFailure(
                              call: Call,
                              e: IOException
                          ) {

                              runOnUiThread {
                                  result.text =
                                      "Connection error:\n${e.message}"
                              }
                          }

                          override fun onResponse(
                              call: Call,
                              response: Response
                          ) {

                              val body =
                                  response.body
                                      ?.string()
                                      ?: ""

                              runOnUiThread {
                                  result.text =
                                      body
                              }
                          }
                      }
                  )
              }

              private fun createToken(
                  type: String
              ) {

                  val url =
                      baseUrl() +
                      "/api/v1/tokens"

                  val json =
                      """
                      {
                        "type":"$type",
                        "name":"Cloud Control App"
                      }
                      """.trimIndent()

                  val body =
                      json.toRequestBody(
                          "application/json".toMediaType()
                      )

                  val builder =
                      Request.Builder()
                          .url(url)
                          .post(body)

                  headers(builder)

                  client.newCall(
                      builder.build()
                  ).enqueue(
                      object : Callback {

                          override fun onFailure(
                              call: Call,
                              e: IOException
                          ) {

                              runOnUiThread {
                                  result.text =
                                      "Error:\n${e.message}"
                              }
                          }

                          override fun onResponse(
                              call: Call,
                              response: Response
                          ) {

                              val text =
                                  response.body
                                      ?.string()
                                      ?: ""

                              runOnUiThread {
                                  result.text =
                                      text
                              }
                          }
                      }
                  )
              }
          }
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip

      - name: Build APK
        run: |
          ./gradle-8.10.2/bin/gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Commit generated Android source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app settings.gradle build.gradle gradle.properties

          if ! git diff --cached --quiet; then
            git commit -m "Add Cloud Control Android app"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-Control-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android source
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-Control-Android-Source
          path: |
            app/
            settings.gradle
            build.gradle
            gradle.properties