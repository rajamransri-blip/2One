name: Validate PTv API

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile FastAPI source
        run: python -m py_compile main.py

      - name: Check OpenAPI routes
        run: |
          python - <<'PY'
          from main import app
          paths = {route.path for route in app.routes}
          required = {
              '/', '/health', '/api/v1/server', '/api/v1/provision', '/api/v1/tokens',
              '/api/v1/database/tables', '/api/v1/sql',
              '/api/v1/dashboard', '/api/v1/diagnostics',
              '/api/v1/devices', '/api/v1/devices/register',
              '/api/v1/services', '/api/v1/logs',
          }
          missing = required - paths
          if missing:
              raise SystemExit(f'Missing routes: {sorted(missing)}')
          print(f'PTv API OK: {len(paths)} routes')
          PY
