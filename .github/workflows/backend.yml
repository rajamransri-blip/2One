name: Backend CI
on:
  push:
    paths: ['backend/**', 'supabase/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'supabase/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-container:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run integration tests
        run: python -m pytest -q
      - name: Validate production config refuses unsafe defaults
        run: |
          APP_ENV=production python - <<'PY'
          from app.config import Settings
          try:
              Settings()
          except ValueError:
              print('Production safety defaults enforced')
          else:
              raise SystemExit('Unsafe production config unexpectedly accepted')
          PY
      - name: Build non-root Docker image
        working-directory: .
        run: docker build -t family-safety-api:ci ./backend
